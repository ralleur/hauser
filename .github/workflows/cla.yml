name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA v1
        if: |
          (
            github.event_name == 'pull_request_target' &&
            (
              github.event.action == 'opened' ||
              github.event.action == 'synchronize' ||
              (github.event.action == 'closed' && github.event.pull_request.merged == true)
            )
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the Hauser Contributor License Agreement v1 and I hereby sign it'
            )
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ralleur/hauser/blob/main/CLA.md
          path-to-signatures: .github/cla-signatures-v1.json
          branch: cla-signatures
          allowlist: 'ralleur,dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: I have read the Hauser Contributor License Agreement v1 and I hereby sign it
          custom-notsigned-prcomment: Thank you for contributing. Please read $pathToCLADocument and reply with the exact CLA v1 signing comment shown below.
          custom-allsigned-prcomment: All contributors have signed the Hauser CLA v1.
