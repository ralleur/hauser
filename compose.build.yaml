services:
  hauser:
    image: "hauser-source:${HAUSER_SOURCE_TAG:-local}"
    user: node
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HAUSER_VERSION: "${HAUSER_SOURCE_TAG:-local}"
        HAUSER_REVISION: "${HAUSER_REVISION:-}"
        HAUSER_SOURCE_URL: "${HAUSER_SOURCE_URL:-}"
        HAUSER_RELEASE: "${HAUSER_RELEASE:-}"
