<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e12">
  <title>Hauser</title>

  <!-- ── PWA / Home-Screen-Web-App (iPadOS 17 Standalone-Kiosk) ──
       Das Manifest steuert Chrome/Android; die apple-* Metas steuern iOS/iPadOS,
       das das Manifest nur teilweise auswertet. Deshalb bewusst beides. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hauser">
  <!-- black-translucent: Content zieht unter die iOS-Statusleiste; viewport-fit=cover
       + safe-area-insets (styles/standalone.css) halten die UI frei. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/brand/hauser-icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!-- ADR-011: Inter Variable ist die einzige kritische Startschrift. Die nur
       im Ambient-Modus verwendete Instrument Serif lädt erst mit diesem Layer. -->
  <link rel="preload" href="/fonts/InterVariable-subset.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

  <!-- Frühester reproduzierbarer Startpunkt; Auswertung und Logging nur im Dev-Build. -->
  <script>performance.mark('hmi:app-start')</script>

  <!-- Icons werden durch B-22 aus dem lokalen MDI-Katalog (Pictogrammers) geladen. -->

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
