blueprint:
  name: Hauser numeric notification (below) v1
  description: >-
    Creates a Hauser persistent notification when a numeric entity drops below
    a threshold, optionally only after it stayed there for a while. The timer
    runs in Home Assistant while Hauser is closed.
  domain: automation
  input:
    source_entity:
      name: Source entity
      selector:
        entity: {}
    threshold:
      name: Threshold
      selector:
        number:
          mode: box
    hold_minutes:
      name: Hold time in minutes
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          mode: box
    notification_id:
      name: Notification id
      selector:
        text: {}
    title:
      name: Title
      selector:
        text: {}
    message:
      name: Message
      selector:
        text: {}

triggers:
  - trigger: numeric_state
    entity_id: !input source_entity
    below: !input threshold
    for:
      minutes: !input hold_minutes

actions:
  - action: persistent_notification.create
    data:
      notification_id: !input notification_id
      title: !input title
      message: !input message
mode: restart
