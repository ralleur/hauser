blueprint:
  name: Hauser state notification v1
  description: >-
    Creates a Hauser persistent notification when an entity changes into one of
    the configured states, optionally only after it stayed there for a while.
    The timer runs in Home Assistant while Hauser is closed.
  domain: automation
  input:
    source_entity:
      name: Source entity
      selector:
        entity: {}
    to_states:
      name: Target states
      description: List of state values that trigger the notification.
      selector:
        object: {}
    hold_minutes:
      name: Hold time in minutes
      description: 0 notifies on the state change, larger values wait first.
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          mode: box
    notification_id:
      name: Notification id
      selector:
        text: {}
    title:
      name: Title
      selector:
        text: {}
    message:
      name: Message
      selector:
        text: {}
    notify_service:
      name: Push service
      description: >-
        Optional notify service of the Home Assistant Companion app, e.g.
        notify.mobile_app_my_phone. Empty means no push.
      default: ""
      selector:
        text: {}
    notify_url:
      name: Push link
      description: Deep link the push opens in the Hauser app.
      default: "hauser://open?screen=notifications"
      selector:
        text: {}

triggers:
  - trigger: state
    entity_id: !input source_entity
    to: !input to_states
    for:
      minutes: !input hold_minutes

variables:
  notify_service: !input notify_service
  notify_url: !input notify_url

actions:
  - action: persistent_notification.create
    data:
      notification_id: !input notification_id
      title: !input title
      message: !input message
  - if:
      - condition: template
        value_template: "{{ notify_service | default('') != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: !input title
          message: !input message
          data:
            url: "{{ notify_url }}"
            clickAction: "{{ notify_url }}"
mode: restart
