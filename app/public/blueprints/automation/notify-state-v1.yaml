blueprint:
  name: Hauser state notification v1
  description: >-
    Creates a Hauser persistent notification when an entity changes into one of
    the configured states, optionally only after it stayed there for a while.
    The timer runs in Home Assistant while Hauser is closed.
  domain: automation
  input:
    source_entity:
      name: Source entity
      selector:
        entity: {}
    to_states:
      name: Target states
      description: List of state values that trigger the notification.
      selector:
        object: {}
    hold_minutes:
      name: Hold time in minutes
      description: 0 notifies on the state change, larger values wait first.
      default: 0
      selector:
        number:
          min: 0
          max: 1440
          mode: box
    notification_id:
      name: Notification id
      selector:
        text: {}
    title:
      name: Title
      selector:
        text: {}
    message:
      name: Message
      selector:
        text: {}

triggers:
  - trigger: state
    entity_id: !input source_entity
    to: !input to_states
    for:
      minutes: !input hold_minutes

actions:
  - action: persistent_notification.create
    data:
      notification_id: !input notification_id
      title: !input title
      message: !input message
mode: restart
