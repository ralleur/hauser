{
  "name": "Hauser",
  "version": "0.7.0",
  "slug": "hauser",
  "description": "A calm, visual Home Assistant frontend for the people who live in the home",
  "url": "https://github.com/ralleur/hauser/tree/main/hauser",
  "arch": [
    "aarch64",
    "amd64"
  ],
  "stage": "experimental",
  "init": false,
  "legacy": true,
  "backup": "cold",
  "homeassistant_api": true,
  "webui": "http://[HOST]:[PORT:4173]",
  "ports": {
    "4173/tcp": 4173
  },
  "ports_description": {
    "4173/tcp": "Hauser web interface"
  },
  "environment": {
    "HMI_HA_CONNECTION_MODE": "supervisor",
    "HMI_ALLOWED_ORIGINS": "http://localhost:4173,http://127.0.0.1:4173",
    "HMI_AI_CUSTOMIZING_ENABLED": "0",
    "HMI_HOUSEHOLD_CONFIG_PATH": "/data/household.json",
    "HMI_HOUSEHOLD_CONFIG_MODE": "active",
    "HMI_CONFIG_PATH": "/data/config.json",
    "HMI_FAMILY_DATA_PATH": "/data/family-data.json",
    "HMI_ROOM_IMAGE_AUTH_MODE": "direct",
    "HMI_ROOM_IMAGE_ASSET_ROOT": "/data/assets",
    "HMI_ROOM_IMAGE_CREDENTIAL_PATH": "/data/room-image-auth.json",
    "HMI_SONG_LIBRARY_DIR": "/data/songs",
    "HMI_AMBIENT_MAP_CONFIG_PATH": "/data/ambient-map.json",
    "HMI_AMBIENT_MAP_ASSET_ROOT": "/data/assets/ambient-maps",
    "HMI_REQUIRED_WRITABLE_DIRS": "/data,/data/assets,/data/assets/ambient-maps,/data/songs"
  },
  "image": "ghcr.io/ralleur/hauser"
}
